name: Check and deploy AhThatsWho
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: 'true'
      BUILD_SHA: ${{ github.sha }}
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v6
      - uses: jdx/mise-action@v4
      - run: mise run install
      - run: mise exec -- npx playwright install --with-deps chromium
      - run: mise run check
      - run: mise run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failures-${{ github.sha }}
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: ahthatswho-${{ github.sha }}
          path: dist/
          retention-days: 14
          if-no-files-found: error
  deploy:
    needs: check
    if: github.event_name != 'pull_request' && github.ref_type == 'branch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: deploy-${{ (github.ref_name == 'main' || github.ref_name == 'master') && 'production' || github.ref_name }}
      cancel-in-progress: false
    env:
      CI: 'true'
      WRANGLER_SEND_METRICS: 'false'
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v6
      - uses: jdx/mise-action@v4
      - uses: actions/download-artifact@v4
        with:
          name: ahthatswho-${{ github.sha }}
          path: dist/
      - name: Deploy checked assets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          DEPLOY_BRANCH: ${{ github.ref_name }}
        shell: bash
        run: |
          if [[ -z "$CLOUDFLARE_API_TOKEN" || -z "$CLOUDFLARE_ACCOUNT_ID" ]]; then
            echo '::error::Set the CLOUDFLARE_API_TOKEN Actions secret and CLOUDFLARE_ACCOUNT_ID repository variable.'
            exit 1
          fi
          if [[ "$DEPLOY_BRANCH" == main || "$DEPLOY_BRANCH" == master ]]; then
            mise exec -- wrangler deploy 2>&1 | tee deployment.log
          else
            # This is a separate Worker: production secrets are not inherited.
            if ! mise exec -- wrangler secret list --env preview | jq -e 'any(.[]; .name == "OPENAI_API_KEY")' > /dev/null; then
              echo '::error::Set OPENAI_API_KEY as a Secret on ahthatswho-drive-preview, then rerun deployment.'
              exit 1
            fi
            # Hash the full branch name: stable, valid DNS alias, no slug collisions.
            alias="branch-$(printf '%s' "$DEPLOY_BRANCH" | sha256sum | cut -c1-16)"
            mise exec -- wrangler versions upload --env preview --preview-alias "$alias" 2>&1 | tee deployment.log
          fi
          {
            echo '### Cloudflare deployment'
            echo '```text'
            cat deployment.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [[ "$DEPLOY_BRANCH" != main && "$DEPLOY_BRANCH" != master ]]; then
            # Check the uploaded version, not the deployed preview Worker or an older alias.
            preview_url="$(sed -nE 's/^Version Preview URL: (https:\/\/[^[:space:]]+).*$/\1/p' deployment.log | tail -1)"
            if [[ -z "$preview_url" ]] || ! curl --fail --silent --show-error --retry 3 --retry-all-errors --retry-delay 2 --max-time 20 "$preview_url/api/ai/check" | jq -e '.available == true' > /dev/null; then
              echo '::error::Preview sponsored AI check failed. Verify the preview Worker secret and access to both drafting and transcription models.'
              exit 1
            fi
          fi
