name: Check and deploy NameCue
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: 'true'
      BUILD_SHA: ${{ github.sha }}
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v6
      - uses: jdx/mise-action@v4
      - run: mise run install
      - run: mise exec -- npx playwright install --with-deps chromium
      - run: mise run check
      - run: mise run e2e
      - uses: actions/upload-artifact@v4
        with:
          name: namecue-${{ github.sha }}
          path: dist/
          retention-days: 14
          if-no-files-found: error
  deploy:
    needs: check
    if: github.event_name != 'pull_request' && github.ref_type == 'branch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: deploy-${{ (github.ref_name == 'main' || github.ref_name == 'master') && 'production' || github.ref_name }}
      cancel-in-progress: false
    env:
      CI: 'true'
      WRANGLER_SEND_METRICS: 'false'
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v6
      - uses: jdx/mise-action@v4
      - uses: actions/download-artifact@v4
        with:
          name: namecue-${{ github.sha }}
          path: dist/
      - name: Deploy checked assets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          DEPLOY_BRANCH: ${{ github.ref_name }}
        shell: bash
        run: |
          if [[ -z "$CLOUDFLARE_API_TOKEN" || -z "$CLOUDFLARE_ACCOUNT_ID" ]]; then
            echo '::error::Set the CLOUDFLARE_API_TOKEN Actions secret and CLOUDFLARE_ACCOUNT_ID repository variable.'
            exit 1
          fi
          if [[ "$DEPLOY_BRANCH" == main || "$DEPLOY_BRANCH" == master ]]; then
            mise exec -- wrangler deploy 2>&1 | tee deployment.log
          else
            # Hash the full branch name: stable, valid DNS alias, no slug collisions.
            alias="branch-$(printf '%s' "$DEPLOY_BRANCH" | sha256sum | cut -c1-16)"
            mise exec -- wrangler versions upload --preview-alias "$alias" 2>&1 | tee deployment.log
          fi
          {
            echo '### Cloudflare deployment'
            echo '```text'
            cat deployment.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
